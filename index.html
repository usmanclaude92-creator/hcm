<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artify HCMS</title>
    <meta name="description" content="Production companion Android app and enterprise workforce system for Artify HCMS with Oman 360° HR records, multi-site geofenced mobile attendance, leave management, project timesheets, OMR 3-decimal payroll, and employee ledger balances." />
    <meta property="og:title" content="Artify HCMS" />
    <meta property="og:description" content="Production companion Android app and enterprise workforce system for Artify HCMS with Oman 360° HR records, multi-site geofenced mobile attendance, leave management, project timesheets, OMR 3-decimal payroll, and employee ledger balances." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Applies the .dark class before first paint so there is no flash of the wrong
      // theme while React mounts. Mirrors src/hooks/useTheme.ts exactly (same storage
      // key, same priority: explicit user choice, then system preference) -- keep the
      // two in sync if that logic ever changes.
      (function () {
        try {
          var stored = localStorage.getItem('artify_theme');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
